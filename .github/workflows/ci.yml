name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [16, 17, 18, 19]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # package.json pins the React 18 dev stack (npm ci above already installs
      # it); other majors are swapped in without touching the lockfile. React 16
      # and 17 additionally need @testing-library/react@12 - RTL 13+ declares
      # react ^18.0.0 and dropped them. React 16.14 is the floor: earlier 16.x
      # has no react/jsx-runtime (see ADR-0005).
      - name: Install React 16
        if: matrix.react == 16
        run: npm install --no-save react@16.14 react-dom@16.14 @types/react@16 @types/react-dom@16 @testing-library/react@12

      - name: Install React 17
        if: matrix.react == 17
        run: npm install --no-save react@17 react-dom@17 @types/react@17 @types/react-dom@17 @testing-library/react@12

      - name: Install React 19
        if: matrix.react == 19
        run: npm install --no-save react@19 react-dom@19 @types/react@19 @types/react-dom@19

      - run: npm run typecheck

      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
